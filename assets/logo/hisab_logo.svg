<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hisab: a ledger page with a rupee tick. Teal + amber, no third-party marks. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#128A86"/>
      <stop offset="1" stop-color="#0B5553"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- ledger card -->
  <rect x="232" y="196" width="560" height="632" rx="64" fill="#F6F8F7"/>
  <!-- ledger lines -->
  <rect x="312" y="300" width="248" height="40" rx="20" fill="#C9DAD9"/>
  <rect x="312" y="392" width="328" height="40" rx="20" fill="#C9DAD9"/>
  <rect x="312" y="484" width="200" height="40" rx="20" fill="#C9DAD9"/>
  <!-- amber badge with a tick -->
  <circle cx="676" cy="660" r="168" fill="#F2A33A"/>
  <path d="M590 664 l60 58 l116 -126" fill="none" stroke="#1C1C1C" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
